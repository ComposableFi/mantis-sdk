[workspace]
exclude = []
members = ["mantis-sdk", "mantis-cli"]
resolver = "2"

[workspace.package]
authors = ["Composable Finance"]
edition = "2021"
homepage = "https://mantis.app"
repository = "https://github.com/ComposableFi/mantis-sdk"
rust-version = "1.84.0"
version = "0.1.0"

[workspace.dependencies]
anchor-client = { version = "0.31.1", features = ["async"] }
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-client = "~2.2.1"
solana-logger = "~2.2.1"
solana-program = "~2.2.1"
solana-rpc = "~2.2.1"
solana-sdk = "~2.2.1"
solana-streamer = "~2.2.1"
solana-test-validator = "~2.2.1"
solana-transaction-status = "~2.2.1"
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "8.0.1", features = ["no-entrypoint"] }

alloy = { version = "0.9.2", features = ["full", "node-bindings", "signer-mnemonic"] }
anyhow = "1.0.96"
base64 = { version = "0.22.1", features = ["alloc"] }
chrono = "0.4.40"
clap = { version = "4.5.32", features = ["derive"] }
dotenv = "0.15.0"
env_logger = { version = "0.11.8" }
futures = "0.3"
futures-util = "0.3"
log = { version = "0.4.27" }
num = "0.4.3"
rand = "0.8.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.26.2", features = ["derive"] }
strum_macros = "0.26.4"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
auctioneer-api = { git = "ssh://git@github.com/ComposableFi/mantis-backend.git", branch = "main", package = "auctioneer-api" }

mantis-sdk = { path = "mantis-sdk" }

[net]
git-fetch-with-cli = true
