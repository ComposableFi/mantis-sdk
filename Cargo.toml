[workspace]
exclude = []
members = ["mantis-sdk", "mantis-cli"]
resolver = "2"

[workspace.package]
authors = ["Composable Finance"]
edition = "2021"
homepage = "https://mantis.app"
repository = "https://github.com/ComposableFi/mantis-sdk"
rust-version = "1.84.0"
version = "0.1.0"

[workspace.dependencies]
anchor-client = { version = "0.31.0", features = ["async"] }
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
solana-client = "~2.1.13"
solana-logger = "~2.1.13"
solana-program = "~2.1.13"
solana-rpc = "~2.1.13"
solana-sdk = "~2.1.13"
solana-streamer = "~2.1.13"
solana-test-validator = "~2.1.13"
solana-transaction-status = "~2.1.13"
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "7.0.0", features = ["no-entrypoint"] }

alloy = { version = "0.9.2", features = ["full", "node-bindings", "signer-mnemonic"] }
anyhow = "1.0.96"
base64 = "0.22.1"
chrono = "0.4.40"
clap = { version = "4.5.32", features = ["derive"] }
dotenv = "0.15.0"
env_logger = { version = "0.11.8" }
log = { version = "0.4.27" }
num = "0.4.3"
rand = "0.8.0"
tokio = { version = "1.43.0", features = ["full"] }

mantis-sdk = { path = "mantis-sdk" }
